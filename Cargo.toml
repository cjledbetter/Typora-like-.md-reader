[package]
name = "typora-rust-reader"
version = "0.1.0"
edition = "2021"
authors = ["Typora-RustReader Team"]
description = "Minimalist distraction-free Markdown reader and editor"
default-run = "typora-rust-reader"

[dependencies]
# Native Windowing & WebView Engine (Tightly Coupled)
tao = "0.37"
wry = "0.57"

# Native File Dialogs (XDG Desktop Portal + Wayland / GTK4)
rfd = "0.17"

# Kernel File System Watcher (inotify on Linux)
notify = "8.2"

# Markdown Parsing, Heading Extraction & Statistics
pulldown-cmark = "0.13"

# Single-Binary Asset Embedding
rust-embed = "8.13"
mime_guess = "2.0"

# CLI Argument Parsing
clap = { version = "4.5", features = ["derive"] }

# Serialization & IPC Bridge
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Types for Custom URI Protocol Handling
http = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
